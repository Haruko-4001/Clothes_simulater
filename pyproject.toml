[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tryon"
version = "0.2.0"
description = "Any-garment realtime virtual try-on — spec v2.0 mock-first reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# P0 engine backends. Both are local libraries with no model weights and no
# network access; they are optional so the mock path still runs on a bare
# numpy/Pillow install. `pip install -e ".[engine]"` or `make install-engine`.
engine = [
  "warp-lang>=1.19",
  "opencv-python-headless>=4.9",
]
# P1 perception (real/hybrid modes only). The adapters use the legacy
# Solutions API (mp.solutions.pose / mp.solutions.hands), which is only
# guaranteed inside 0.10.x; mediapipe has no CPython 3.13 wheels, so the
# marker keeps `.[perception]` installable and the adapter falls back to Stub
# with E_ADAPTER_FALLBACK when it is missing.
perception = [
  'mediapipe>=0.10.9,<0.11; python_version < "3.13"',
]

[project.scripts]
tryon-run = "app.main:main"
tryon-cli = "app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = { "" = "src" }
